<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="40%" stop-color="#0C101D"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <!-- Brand Rose / Crimson Gradient -->
    <linearGradient id="roseBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Glass Card Gradients -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="totalPayable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Ambient Lighting -->
    <radialGradient id="glowTopLeft" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.15"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="540" rx="20" fill="url(#heroBg)"/>
  <rect width="1200" height="540" rx="20" fill="url(#glowTopLeft)"/>
  <rect width="1200" height="540" rx="20" fill="url(#glowBottomRight)"/>
  <rect x="0.5" y="0.5" width="1199" height="539" rx="19.5" stroke="#334155" stroke-opacity="0.4"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="540"/>
    <line x1="630" y1="0" x2="630" y2="540"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- LEFT HERO SECTION (WIDTH: 540px) -->
  <g transform="translate(64, 48)">

    <!-- Integrated BrandForge Logo Mark & Header -->
    <g transform="translate(0, 0)">
      <rect width="52" height="52" rx="14" fill="url(#roseBrand)"/>
      <!-- Fork & Knife Line Icon -->
      <path d="M20 16V27C20 30 22.5 32.5 25.5 32.5M31 16V27C31 30 28.5 32.5 25.5 32.5M25.5 32.5V39M25.5 16V25" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="25.5" cy="39" r="2" fill="#FFFFFF"/>

      <text x="68" y="28" class="font-sans" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
        BrandForge <tspan fill="url(#roseBrand)">POS</tspan>
      </text>
      <text x="70" y="46" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.2">
        ENTERPRISE RESTAURANT MANAGEMENT SYSTEM
      </text>
    </g>

    <!-- Headline -->
    <text x="0" y="98" class="font-sans" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      Offline-First Operations &amp; Kitchen Intelligence
    </text>
    <text x="0" y="125" class="font-sans" font-size="15" font-weight="400" fill="#94A3B8">
      Dine-in, takeaway, KDS, UPI QR, inventory &amp; payroll. Runs 100% on your local LAN.
    </text>

    <!-- 4 Structured Value Points with SVG Checkmarks -->
    <g transform="translate(0, 160)">
      
      <!-- Point 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="14" font-weight="500" fill="#E2E8F0">
          <tspan font-weight="700" fill="#FFFFFF">100% Offline-First:</tspan> Unplug the WAN, keep serving &amp; billing
        </text>
      </g>

      <!-- Point 2 -->
      <g transform="translate(0, 38)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="14" font-weight="500" fill="#E2E8F0">
          <tspan font-weight="700" fill="#FFFFFF">Kitchen Display (KDS):</tspan> Multi-station bump bar with audio chimes
        </text>
      </g>

      <!-- Point 3 -->
      <g transform="translate(0, 76)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="14" font-weight="500" fill="#E2E8F0">
          <tspan font-weight="700" fill="#FFFFFF">Server-Authoritative Money:</tspan> Automated Indian GST &amp; UPI QR
        </text>
      </g>

      <!-- Point 4 -->
      <g transform="translate(0, 114)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="14" font-weight="500" fill="#E2E8F0">
          <tspan font-weight="700" fill="#FFFFFF">Direct Thermal Hardware:</tspan> USB /dev/usb/lp0 &amp; Port 9100 ESC/POS
        </text>
      </g>
    </g>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="52" y="18" class="font-sans" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Table Canvas</text>

      <rect x="115" y="0" width="115" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="172" y="18" class="font-sans" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">FIFO Inventory</text>

      <rect x="240" y="0" width="105" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="292" y="18" class="font-sans" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Staff Payroll</text>

      <rect x="355" y="0" width="145" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="427" y="18" class="font-sans" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">AI Model Context (MCP)</text>
    </g>

    <!-- License & Build Tagline -->
    <text x="0" y="410" class="font-sans" font-size="12" font-weight="500" fill="#64748B">
      Open Source (AGPL-3.0) · Self-Hosted · Built with NestJS 11, Next.js 16 &amp; PostgreSQL
    </text>
  </g>

  <!-- RIGHT SECTION: FIXED GLASS POS TERMINAL CARD (X: 650, WIDTH: 486) -->
  <g transform="translate(650, 48)">
    
    <!-- Outer Card Shell -->
    <rect width="486" height="444" rx="16" fill="url(#cardSurface)" stroke="#334155" stroke-opacity="0.8" filter="url(#glassShadow)"/>

    <!-- Terminal Window Top Bar -->
    <rect width="486" height="46" rx="16" fill="#0F172A" fill-opacity="0.95"/>
    <rect y="30" width="486" height="16" fill="#0F172A" fill-opacity="0.95"/>
    <line x1="0" y1="46" x2="486" y2="46" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Window Dots -->
    <circle cx="22" cy="23" r="5.5" fill="#EF4444"/>
    <circle cx="40" cy="23" r="5.5" fill="#F59E0B"/>
    <circle cx="58" cy="23" r="5.5" fill="#10B981"/>

    <!-- Window Title -->
    <text x="80" y="28" class="font-sans" font-size="13" font-weight="700" fill="#E2E8F0">
      Table 04 · Dine-In
    </text>
    <rect x="385" y="13" width="85" height="20" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="427" y="27" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">12:48 PM</text>

    <!-- Order Items Container -->
    <g transform="translate(24, 68)">
      
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Paneer Tikka (Tandoor) × 2</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Modifier: Extra Mint Dip, Spicy</text>
        <text x="438" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 560.00</text>
        <line x1="0" y1="40" x2="438" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 50)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Butter Garlic Naan × 4</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Crispy, Butter Glaze</text>
        <text x="438" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 240.00</text>
        <line x1="0" y1="40" x2="438" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 100)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Dal Makhani (Special)</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Slow-cooked black lentils, cream</text>
        <text x="438" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 320.00</text>
        <line x1="0" y1="40" x2="438" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Subtotal & GST Line -->
      <g transform="translate(0, 154)">
        <text x="0" y="14" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Subtotal (Inclusive)</text>
        <text x="438" y="14" class="font-mono" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">₹ 1,120.00</text>

        <text x="0" y="34" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">CGST (2.5%) + SGST (2.5%)</text>
        <text x="438" y="34" class="font-mono" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">₹ 56.00</text>
      </g>

      <!-- TOTAL PAYABLE BAR -->
      <g transform="translate(0, 206)">
        <rect width="438" height="48" rx="10" fill="url(#totalPayable)"/>
        <text x="18" y="30" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TOTAL PAYABLE</text>
        <text x="420" y="30" class="font-mono" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="end">₹ 1,120.00</text>
      </g>

      <!-- Status Chips -->
      <g transform="translate(0, 272)">
        <rect width="210" height="34" rx="8" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.4"/>
        <circle cx="16" cy="17" r="5" fill="#10B981"/>
        <text x="30" y="22" class="font-sans" font-size="12" font-weight="700" fill="#6EE7B7">KOT Sent to Kitchen</text>

        <rect x="220" y="0" width="218" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
        <circle cx="236" cy="17" r="5" fill="#38BDF8"/>
        <text x="250" y="22" class="font-sans" font-size="12" font-weight="700" fill="#BAE6FD">UPI QR Ready on Till</text>
      </g>
    </g>
  </g>
</svg>
