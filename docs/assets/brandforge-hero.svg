<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Amber / Accent Glow -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="totalBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Radial Ambient Lighting -->
    <radialGradient id="ambientRose" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientBlue" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.2"/>
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E11D48" flood-opacity="0.4"/>
    </filter>

    <style>
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
      .anim-float { animation: floating 5s ease-in-out infinite; }
      @keyframes floating {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      .anim-pulse { animation: pulseGlow 3s ease-in-out infinite; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .shimmer-badge { animation: shimmer 4s infinite linear; }
      .fade-up-1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-up-2 { animation: fadeUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-up-3 { animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="520" rx="20" fill="url(#ambientRose)"/>
  <rect width="1200" height="520" rx="20" fill="url(#ambientBlue)"/>
  
  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="519" rx="19.5" stroke="#334155" stroke-opacity="0.4"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="520" />
    <line x1="650" y1="0" x2="650" y2="520" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="390" x2="1200" y2="390" />
  </g>

  <!-- LEFT HERO COLUMN -->
  <g transform="translate(64, 48)">
    
    <!-- Top Pill: Brand & Category -->
    <g class="fade-up-1">
      <rect width="270" height="32" rx="16" fill="#1E293B" fill-opacity="0.7" stroke="#E11D48" stroke-opacity="0.5"/>
      <circle cx="16" cy="16" r="4" fill="#FF3366" class="anim-pulse"/>
      <text x="28" y="21" class="font-sans" font-size="12" font-weight="700" fill="#FDA4AF" letter-spacing="0.8">
        BRANDFORGE MEDIA · SUITE
      </text>
      <rect x="205" y="6" width="56" height="20" rx="10" fill="#E11D48" fill-opacity="0.3"/>
      <text x="233" y="20" class="font-sans" font-size="11" font-weight="700" fill="#FECDD3" text-anchor="middle">v1.8.2</text>
    </g>

    <!-- Main Title -->
    <g class="fade-up-2" transform="translate(0, 52)">
      <text x="0" y="44" class="font-sans" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
        BrandForge <tspan fill="url(#brandRose)">POS</tspan>
      </text>
      <text x="0" y="78" class="font-sans" font-size="20" font-weight="500" fill="#CBD5E1">
        Enterprise Restaurant Management &amp; Offline Floor OS
      </text>
    </g>

    <!-- Feature Checklist Points -->
    <g class="fade-up-3" transform="translate(0, 160)">
      <!-- Bullet 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="15" font-weight="500" fill="#F1F5F9">
          <tspan font-weight="700" fill="#FFFFFF">100% Offline-First:</tspan> Runs entirely on local LAN hardware
        </text>
      </g>

      <!-- Bullet 2 -->
      <g transform="translate(0, 36)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="15" font-weight="500" fill="#F1F5F9">
          <tspan font-weight="700" fill="#FFFFFF">Live Kitchen Display (KDS):</tspan> Station Kanban &amp; audio alerts
        </text>
      </g>

      <!-- Bullet 3 -->
      <g transform="translate(0, 72)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="15" font-weight="500" fill="#F1F5F9">
          <tspan font-weight="700" fill="#FFFFFF">Server-Authoritative Money:</tspan> Automated Indian GST &amp; UPI QR
        </text>
      </g>

      <!-- Bullet 4 -->
      <g transform="translate(0, 108)">
        <circle cx="12" cy="12" r="10" fill="#E11D48" fill-opacity="0.2"/>
        <path d="M8 12L11 15L16 9" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="16" class="font-sans" font-size="15" font-weight="500" fill="#F1F5F9">
          <tspan font-weight="700" fill="#FFFFFF">Direct Thermal Hardware:</tspan> USB /dev/usb/lp0 &amp; Port 9100 ESC/POS
        </text>
      </g>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="105" height="30" rx="8" fill="#1E293B" stroke="#475569" stroke-opacity="0.5"/>
      <text x="52" y="19" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Table Canvas</text>

      <rect x="115" y="0" width="115" height="30" rx="8" fill="#1E293B" stroke="#475569" stroke-opacity="0.5"/>
      <text x="172" y="19" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">FIFO Inventory</text>

      <rect x="240" y="0" width="110" height="30" rx="8" fill="#1E293B" stroke="#475569" stroke-opacity="0.5"/>
      <text x="295" y="19" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Staff Payroll</text>

      <rect x="360" y="0" width="135" height="30" rx="8" fill="#1E293B" stroke="#475569" stroke-opacity="0.5"/>
      <text x="427" y="19" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">AI Model Context (MCP)</text>
    </g>

    <!-- License Note -->
    <text x="2" y="405" class="font-sans" font-size="13" font-weight="500" fill="#64748B">
      Open Source (AGPL-3.0) · Self-Hosted · Built with NestJS, Next.js 16 &amp; PostgreSQL
    </text>
  </g>

  <!-- RIGHT COLUMN: FLOATING POS TERMINAL GLASS CARD -->
  <g class="anim-float" transform="translate(680, 48)">
    
    <!-- Outer Card Shell -->
    <rect width="460" height="424" rx="16" fill="url(#glassCard)" stroke="#334155" stroke-opacity="0.8" filter="url(#cardShadow)"/>
    <rect width="460" height="424" rx="16" fill="url(#cardGlow)"/>

    <!-- Terminal Window Top Bar -->
    <rect width="460" height="48" rx="16" fill="#0F172A" fill-opacity="0.9"/>
    <rect y="32" width="460" height="16" fill="#0F172A" fill-opacity="0.9"/>
    <line x1="0" y1="48" x2="460" y2="48" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Window Control Dots -->
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>

    <!-- Terminal Title Bar -->
    <text x="90" y="29" class="font-sans" font-size="13" font-weight="700" fill="#E2E8F0">
      Table 04 · Dine-In
    </text>
    <rect x="360" y="14" width="76" height="20" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="398" y="28" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">12:48 PM</text>

    <!-- Receipt / Order Rows -->
    <g transform="translate(24, 70)">
      
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Paneer Tikka (Tandoor) × 2</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Modifier: Extra Mint Dip, Spicy</text>
        <text x="412" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 560.00</text>
        <line x1="0" y1="40" x2="412" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 48)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Butter Garlic Naan × 4</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Crispy, Butter Glaze</text>
        <text x="412" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 240.00</text>
        <line x1="0" y1="40" x2="412" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 96)">
        <text x="0" y="14" class="font-sans" font-size="14" font-weight="600" fill="#F8FAFC">Dal Makhani (Special)</text>
        <text x="0" y="30" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Slow-cooked black lentils, cream</text>
        <text x="412" y="14" class="font-mono" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="end">₹ 320.00</text>
        <line x1="0" y1="40" x2="412" y2="40" stroke="#1E293B" stroke-width="1"/>
      </g>

      <!-- Tax & Subtotal Breakdown -->
      <g transform="translate(0, 146)">
        <text x="0" y="14" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">Subtotal (Inclusive)</text>
        <text x="412" y="14" class="font-mono" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">₹ 1,120.00</text>

        <text x="0" y="34" class="font-sans" font-size="13" font-weight="500" fill="#94A3B8">CGST (2.5%) + SGST (2.5%)</text>
        <text x="412" y="34" class="font-mono" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="end">₹ 56.00</text>
      </g>

      <!-- TOTAL HIGHLIGHT BAR -->
      <g transform="translate(0, 196)">
        <rect width="412" height="46" rx="10" fill="url(#totalBarGrad)"/>
        <text x="16" y="29" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">TOTAL PAYABLE</text>
        <text x="396" y="29" class="font-mono" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="end">₹ 1,120.00</text>
      </g>

      <!-- Realtime Kitchen & UPI Status Chips -->
      <g transform="translate(0, 256)">
        <!-- KOT Chip -->
        <g>
          <rect width="198" height="34" rx="8" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.4"/>
          <circle cx="16" cy="17" r="5" fill="#10B981"/>
          <text x="30" y="22" class="font-sans" font-size="12" font-weight="700" fill="#6EE7B7">KOT Sent to Kitchen</text>
        </g>
        <!-- UPI QR Chip -->
        <g transform="translate(208, 0)">
          <rect width="204" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
          <circle cx="16" cy="17" r="5" fill="#38BDF8"/>
          <text x="30" y="22" class="font-sans" font-size="12" font-weight="700" fill="#BAE6FD">UPI QR Ready on Till</text>
        </g>
      </g>
    </g>
  </g>
</svg>
